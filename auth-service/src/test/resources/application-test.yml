# Test Configuration for Auth Service
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    user:
      name: test
      password: test

# JWT Configuration for Testing
jwt:
  secret: testSecretKeyForJWTTokenGenerationInTestEnvironment
  expiration: 3600000

# Logging Configuration
logging:
  level:
    com.safalifter: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Eureka Configuration for Testing
eureka:
  client:
    enabled: false
    
# Feign Configuration for Testing
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000